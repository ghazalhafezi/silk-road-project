<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ورود به سایت راه ابریشم">
  <title>ورود به سایت راه ابریشم</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f6f8;
      color: #20242c;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 36px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e7e9ee;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(20, 30, 50, .06);
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      background: #1d4ed8;
      color: #fff;
      font-size: 17px;
      line-height: 1.7;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ورود به سایت راه ابریشم</h1>
    <a href="https://alighamsarimusic.com/silkroad">
      ورود به سایت راه ابریشم
    </a>
  </main>
</body>
</html>
